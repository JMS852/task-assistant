[project]
name = "task-assistant"
version = "1.0.0"
description = "Windows desktop task assistant — AI-powered WeChat/QQ task recognition"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B904"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["test/python"]
pythonpath = ["python"]
